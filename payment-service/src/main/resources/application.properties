server.port=8084
spring.application.name=payment-service

spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=system
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=payment-service

logging.level.com.ott.payment=DEBUG

# ── Kafka Producer Configuration ────────────────────────────────────
# bootstrap-servers = address of your Kafka broker (from Docker)
spring.kafka.bootstrap-servers=localhost:9092

# Serializers: key is String (userId), value is JSON (NotificationEvent)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Add type info to message so consumer knows which class to deserialize to
spring.kafka.producer.properties.spring.json.add.type.headers=false

#for user-service feign client	
user.service.url=http://localhost:8083